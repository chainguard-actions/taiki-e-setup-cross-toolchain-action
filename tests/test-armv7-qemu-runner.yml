name: Test armv7-unknown-linux-gnueabihf with QEMU runner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          # Install rustup/rustc if not already present
          if ! command -v rustc > /dev/null 2>&1; then
            if command -v rustup > /dev/null 2>&1; then
              rustup toolchain install stable --no-self-update
              rustup default stable
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --no-modify-path
            fi
          fi
          # Always ensure cargo bin is on PATH for subsequent steps
          CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ -d "$CARGO_BIN" ]; then
            echo "$CARGO_BIN" >> "$GITHUB_PATH"
          fi
          # Verify rustc is available in this step
          export PATH="${CARGO_BIN}:$PATH"
          rustc --version

      - id: action
        uses: .
        with:
          target: armv7-unknown-linux-gnueabihf
          runner: qemu-user
        continue-on-error: true

      - name: Assert action outcome and env vars
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CARGO_BUILD_TARGET: ${{ env.CARGO_BUILD_TARGET }}
          RUNNER_VAR: ${{ env.CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER }}
        run: |
          echo "outcome: $OUTCOME"
          echo "CARGO_BUILD_TARGET: $CARGO_BUILD_TARGET"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: $RUNNER_VAR"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: verify env vars are set correctly
            if [ "$CARGO_BUILD_TARGET" != "armv7-unknown-linux-gnueabihf" ]; then
              echo "FAIL: expected CARGO_BUILD_TARGET=armv7-unknown-linux-gnueabihf, got '$CARGO_BUILD_TARGET'"
              exit 1
            fi
            if ! echo "$RUNNER_VAR" | grep -q 'qemu'; then
              echo "FAIL: expected a qemu runner, got '$RUNNER_VAR'"
              exit 1
            fi
            echo "PASS: action succeeded with QEMU runner configured"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action may fail if Docker is not available for QEMU installation
            echo "PASS: action failed (likely Docker unavailable for QEMU install) - acceptable in act environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert qemu-arm binary is available (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if command -v qemu-arm > /dev/null 2>&1; then
              echo "PASS: qemu-arm is available"
              qemu-arm --version
            else
              echo "FAIL: qemu-arm not found in PATH despite action succeeding"
              exit 1
            fi
          else
            echo "SKIP: action did not succeed, skipping qemu-arm check"
          fi
