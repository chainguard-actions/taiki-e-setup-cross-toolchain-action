name: Test basic aarch64-unknown-linux-gnu cross toolchain setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          # Install rustup/rustc if not already present
          if ! command -v rustc > /dev/null 2>&1; then
            if command -v rustup > /dev/null 2>&1; then
              rustup toolchain install stable --no-self-update
              rustup default stable
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --no-modify-path
            fi
          fi
          # Always ensure cargo bin is on PATH for subsequent steps
          CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ -d "$CARGO_BIN" ]; then
            echo "$CARGO_BIN" >> "$GITHUB_PATH"
          fi
          # Verify rustc is available in this step
          export PATH="${CARGO_BIN}:$PATH"
          rustc --version
          rustup --version || true

      - id: action
        uses: .
        with:
          target: aarch64-unknown-linux-gnu
          runner: none

      - name: Assert CARGO_BUILD_TARGET is set
        env:
          CARGO_BUILD_TARGET: ${{ env.CARGO_BUILD_TARGET }}
        run: |
          echo "CARGO_BUILD_TARGET: $CARGO_BUILD_TARGET"
          if [ "$CARGO_BUILD_TARGET" != "aarch64-unknown-linux-gnu" ]; then
            echo "FAIL: expected CARGO_BUILD_TARGET=aarch64-unknown-linux-gnu, got '$CARGO_BUILD_TARGET'"
            exit 1
          fi
          echo "PASS: CARGO_BUILD_TARGET is set correctly"

      - name: Assert CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER is set
        env:
          LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: $LINKER"
          if [ -z "$LINKER" ]; then
            echo "FAIL: expected CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER to be set"
            exit 1
          fi
          echo "PASS: linker is set to '$LINKER'"

      - name: Assert cross-compiler is available
        env:
          LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}
        run: |
          echo "Checking linker: $LINKER"
          if ! command -v "$LINKER" > /dev/null 2>&1; then
            echo "FAIL: linker '$LINKER' not found in PATH"
            exit 1
          fi
          echo "PASS: linker '$LINKER' is available"
