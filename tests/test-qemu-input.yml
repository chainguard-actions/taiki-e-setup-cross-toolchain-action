name: Test qemu input for cross toolchain setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          if ! command -v rustc >/dev/null 2>&1 || ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version
          rustup --version

      - id: action
        uses: .
        with:
          target: aarch64-unknown-linux-gnu
          runner: qemu-user
          qemu: "11.0"

      - name: Assert CARGO_BUILD_TARGET is set
        env:
          CARGO_BUILD_TARGET: ${{ env.CARGO_BUILD_TARGET }}
        run: |
          echo "CARGO_BUILD_TARGET: $CARGO_BUILD_TARGET"
          if [ "$CARGO_BUILD_TARGET" != "aarch64-unknown-linux-gnu" ]; then
            echo "FAIL: expected CARGO_BUILD_TARGET=aarch64-unknown-linux-gnu, got '$CARGO_BUILD_TARGET'"
            exit 1
          fi
          echo "PASS"

      - name: Assert CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER is set
        env:
          RUNNER_VAR: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER }}
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: $RUNNER_VAR"
          if [ -z "$RUNNER_VAR" ]; then
            echo "FAIL: expected CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER to be set"
            exit 1
          fi
          echo "PASS: runner is '$RUNNER_VAR'"

      - name: Assert qemu-aarch64 is available
        run: |
          if ! command -v qemu-aarch64 >/dev/null 2>&1; then
            echo "FAIL: qemu-aarch64 not found in PATH"
            exit 1
          fi
          echo "PASS: qemu-aarch64 found: $(qemu-aarch64 --version | head -1)"
