name: Test package input for cross-compilation setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            echo "rustc already available: $(rustc --version)"
          fi
      - name: Ensure rustup is on PATH
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: aarch64-unknown-linux-gnu
          runner: none
          package: libssl-dev
      - name: Assert action result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}
          CARGO_BUILD_TARGET: ${{ env.CARGO_BUILD_TARGET }}
        run: |
          echo "outcome: $OUTCOME"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: $LINKER"
          echo "CARGO_BUILD_TARGET: $CARGO_BUILD_TARGET"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$LINKER" ]; then
              echo "FAIL: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER is not set"
              exit 1
            fi
            if [ "$CARGO_BUILD_TARGET" != "aarch64-unknown-linux-gnu" ]; then
              echo "FAIL: expected CARGO_BUILD_TARGET=aarch64-unknown-linux-gnu, got: $CARGO_BUILD_TARGET"
              exit 1
            fi
            echo "PASS: linker=$LINKER, package input accepted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely package installation not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
