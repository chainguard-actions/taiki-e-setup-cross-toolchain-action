name: Test basic musl cross-compilation setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            echo "rustc already available: $(rustc --version)"
          fi
      - name: Ensure rustup is on PATH
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: x86_64-unknown-linux-musl
      - name: Assert action result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CARGO_BUILD_TARGET: ${{ env.CARGO_BUILD_TARGET }}
        run: |
          echo "outcome: $OUTCOME"
          echo "CARGO_BUILD_TARGET: $CARGO_BUILD_TARGET"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CARGO_BUILD_TARGET" != "x86_64-unknown-linux-musl" ]; then
              echo "FAIL: expected CARGO_BUILD_TARGET=x86_64-unknown-linux-musl, got: $CARGO_BUILD_TARGET"
              exit 1
            fi
            echo "PASS: CARGO_BUILD_TARGET=$CARGO_BUILD_TARGET"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely Docker not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
