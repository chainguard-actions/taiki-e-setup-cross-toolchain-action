name: Test valgrind input for cross toolchain setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          if ! command -v rustc >/dev/null 2>&1 || ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version
          rustup --version

      - id: action
        uses: .
        with:
          target: host-tuple
          runner: valgrind
          valgrind: "3.26.0"

      - name: Assert CARGO_BUILD_TARGET is set
        env:
          CARGO_BUILD_TARGET: ${{ env.CARGO_BUILD_TARGET }}
        run: |
          echo "CARGO_BUILD_TARGET: $CARGO_BUILD_TARGET"
          if [ -z "$CARGO_BUILD_TARGET" ]; then
            echo "FAIL: expected CARGO_BUILD_TARGET to be set"
            exit 1
          fi
          echo "PASS: CARGO_BUILD_TARGET=$CARGO_BUILD_TARGET"

      - name: Assert valgrind is available
        run: |
          if ! command -v valgrind >/dev/null 2>&1; then
            echo "FAIL: valgrind not found in PATH"
            exit 1
          fi
          echo "PASS: valgrind found: $(valgrind --version)"
