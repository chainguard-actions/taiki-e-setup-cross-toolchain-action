name: Test ARMv7 cross-compilation setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            echo "rustc already available: $(rustc --version)"
          fi
      - name: Ensure rustup is on PATH
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: armv7-unknown-linux-gnueabihf
      - name: Assert action result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LINKER: ${{ env.CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER }}
          CC: ${{ env.CC_armv7_unknown_linux_gnueabihf }}
          RUNNER_VAR: ${{ env.CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER }}
        run: |
          echo "outcome: $OUTCOME"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: $LINKER"
          echo "CC_armv7_unknown_linux_gnueabihf: $CC"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: $RUNNER_VAR"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$LINKER" ]; then
              echo "FAIL: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER is not set"
              exit 1
            fi
            if [ -z "$CC" ]; then
              echo "FAIL: CC_armv7_unknown_linux_gnueabihf is not set"
              exit 1
            fi
            if [ -z "$RUNNER_VAR" ]; then
              echo "FAIL: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER is not set"
              exit 1
            fi
            if ! echo "$RUNNER_VAR" | grep -q "qemu"; then
              echo "FAIL: expected runner to contain 'qemu', got: $RUNNER_VAR"
              exit 1
            fi
            echo "PASS: linker=$LINKER cc=$CC runner=$RUNNER_VAR"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely Docker not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
